name: Refresh price data

# Weekly, after the US market close on Friday (UTC Saturday morning).
on:
  schedule:
    - cron: '0 6 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install yfinance pandas
      - run: node scripts/test_strategy.mjs
      - run: python scripts/update_data.py
      - run: node scripts/build_summary.mjs
      - run: node ema-cross/build.mjs public/data  # EMA cross site data, served by GitHub Pages
      - name: Commit if changed
        run: |
          if git diff --quiet public/data ema-cross index.html; then
            echo "No new prices."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/data ema-cross/summary.json ema-cross/events.json ema-cross/screener.json index.html
          git commit -m "data: prices to $(node -p "require('./public/data/universe.json').asOf")"
          git push
